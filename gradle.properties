org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The Zig compiler Gradle runs to build native/. Override in
# ~/.gradle/gradle.properties if Android Studio's PATH doesn't include it,
# e.g. wns.zig=/home/<you>/.zvm/bin/zig
wns.zig=zig
# Zig optimize mode for libwnscore.so. ReleaseSafe keeps bounds and
# overflow checks (a panic is logged to logcat) at near-release speed;
# Debug-mode SQLite is too slow to index a real dictionary.
wns.zigOptimize=ReleaseSafe
